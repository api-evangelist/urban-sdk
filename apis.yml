name: Urban SDK
description: Urban SDK is a geospatial AI and data analytics company serving the public
  sector, delivering hourly road-speed and traffic data, analytics, and AI tools that
  help cities, counties, and transportation agencies prioritize issues, pinpoint trends,
  and act on traffic management, public safety, emergency response, and infrastructure
  planning. A Techstars portfolio company based in Jacksonville, Florida, Urban SDK
  delivers its data through a web platform and automated Workflows reports rather than
  a public API, and currently publishes no developer documentation or client SDKs.
